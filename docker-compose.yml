# Lokaal draaien. Productie draait op beheerde PostgreSQL en containers in de EU.
#
#   docker compose up -d db                                  database starten
#   docker compose run --rm scanner voorbeeld.nl             één domein scannen
#   docker compose run --rm scanner --bestand /data/testset.txt --uit /data/resultaten
#                                                            testset scannen (map ./testset)
#   docker compose --profile api up api                      API op http://localhost:8080/api/v1
#   docker compose --profile web up web                      klantomgeving op http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qbicle
      POSTGRES_PASSWORD: qbicle
      POSTGRES_DB: qbicle
    ports:
      - "5432:5432"
    volumes:
      - qbicle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbicle"]
      interval: 5s
      retries: 10

  migrate:
    image: postgres:16
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
    volumes:
      - ./:/repo:ro
    entrypoint: ["bash", "/repo/scripts/db-migrate.sh"]

  scanner:
    build: .
    profiles: ["tools"]
    environment:
      QBICLE_SCANNER_INFO_URL: ${QBICLE_SCANNER_INFO_URL:-https://qbicle.example/scanner}
      QBICLE_DOH_URL: ${QBICLE_DOH_URL:-https://cloudflare-dns.com/dns-query}
    volumes:
      - ./testset:/data

  api:
    build: .
    profiles: ["api"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      QBICLE_APP_ORIGIN: ${QBICLE_APP_ORIGIN:-http://localhost:3000}
      # Lokaal zonder https; in productie altijd aan laten.
      QBICLE_SECURE_COOKIES: "uit"
      PORT: "8080"
      # Uit .env (niet gecommit); zonder sleutel gaat mail naar de console.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_REPLY_TO: ${QBICLE_MAIL_REPLY_TO:-}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
    ports:
      - "8080:8080"
    entrypoint: ["npx", "--no-install", "tsx", "apps/api/src/server.ts"]

  # Klantomgeving (registreren, abonnement, dashboard) met de API erin onder /api/v1.
  web:
    build: .
    profiles: ["web"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      # Moet het adres zijn dat je in de browser gebruikt (inloglinks en controle op herkomst).
      QBICLE_APP_ORIGIN: ${QBICLE_WEB_ORIGIN:-http://localhost:3000}
      QBICLE_SECURE_COOKIES: "uit"
      PORT: "3000"
      # Testbetalingen tot Mollie gekoppeld is (wacht op de BV).
      QBICLE_BETAALPROVIDER: nep
      # 'aan' = mail (inloglinks) in het Terminal-venster in plaats van via Brevo.
      QBICLE_MAIL_CONSOLE: ${QBICLE_MAIL_CONSOLE:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_REPLY_TO: ${QBICLE_MAIL_REPLY_TO:-}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
    ports:
      # Andere poort op je computer: QBICLE_WEB_PORT=3300 (scripts/klantomgeving.sh kiest zelf een vrije).
      - "${QBICLE_WEB_PORT:-3000}:3000"
    entrypoint: ["npx", "--no-install", "tsx", "apps/web/src/server.ts"]

volumes:
  qbicle-db:
