# Lokaal draaien. Productie draait op beheerde PostgreSQL en containers in de EU.
#
#   docker compose up -d db                                  database starten
#   docker compose run --rm scanner voorbeeld.nl             één domein scannen
#   docker compose run --rm scanner --bestand /data/testset.txt --uit /data/resultaten
#                                                            testset scannen (map ./testset)
#   docker compose run --rm bewaker                          één ronde van de bewakingsagent (cockpit)
#   docker compose run --rm worker --eenmalig                scans plannen en de wachtrij één keer afwerken
#   docker compose --profile api up api                      API op http://localhost:8080/api/v1
#   docker compose --profile web up web                      klantomgeving op http://localhost:3000
#   docker compose --profile cockpit up cockpit              interne cockpit op http://localhost:3100
#                                                            (makkelijker: bash scripts/cockpit.sh)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qbicle
      POSTGRES_PASSWORD: qbicle
      POSTGRES_DB: qbicle
    ports:
      - "5432:5432"
    volumes:
      - qbicle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qbicle"]
      interval: 5s
      retries: 10

  migrate:
    image: postgres:16
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
    volumes:
      - ./:/repo:ro
    entrypoint: ["bash", "/repo/scripts/db-migrate.sh"]

  scanner:
    build: .
    profiles: ["tools"]
    environment:
      QBICLE_SCANNER_INFO_URL: ${QBICLE_SCANNER_INFO_URL:-https://qbicle.example/scanner}
      QBICLE_DOH_URL: ${QBICLE_DOH_URL:-https://cloudflare-dns.com/dns-query}
    volumes:
      - ./testset:/data

  # Bewakingsagent: zet vastgelopen scans opnieuw in de wachtrij en doet voorstellen
  # in de cockpit. In productie elke 5 minuten; lokaal met de hand.
  bewaker:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
      # Btw verlegd: 'test' = nep-VIES zonder netwerk (000000 = ongeldig, 999999 = storing); leeg = echte VIES van de EU.
      QBICLE_VIES: ${QBICLE_VIES:-}
      # Btw-nummer van Qbicle (na oprichting BV); dan geeft VIES een consultatienummer als bewijs.
      QBICLE_BTW_NUMMER: ${QBICLE_BTW_NUMMER:-}
    entrypoint: ["npx", "--no-install", "tsx", "packages/ops/src/cli.ts"]

  # Scan-worker met planner: zet scans van bevestigde domeinen in de wachtrij (eerste scan
  # meteen, daarna wekelijks), draait de passieve scanner en slaat het resultaat op voor het
  # dashboard. Start vanzelf mee met de klantomgeving (web). Geen poortscans, nooit lekken uitproberen.
  worker:
    build: .
    profiles: ["web", "tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      QBICLE_APP_ORIGIN: ${QBICLE_WEB_ORIGIN:-http://localhost:3000}
      QBICLE_SCANNER_INFO_URL: ${QBICLE_SCANNER_INFO_URL:-https://qbicle.example/scanner}
      QBICLE_DOH_URL: ${QBICLE_DOH_URL:-https://cloudflare-dns.com/dns-query}
      QBICLE_SCAN_INTERVAL_DAGEN: ${QBICLE_SCAN_INTERVAL_DAGEN:-7}
      # Lokale testopstelling: zonder Brevo-sleutel gaat de mail "eerste scan klaar" naar de log.
      NODE_ENV: development
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_REPLY_TO: ${QBICLE_MAIL_REPLY_TO:-}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
      # Btw verlegd: 'test' = nep-VIES zonder netwerk (000000 = ongeldig, 999999 = storing); leeg = echte VIES van de EU.
      QBICLE_VIES: ${QBICLE_VIES:-}
      # Btw-nummer van Qbicle (na oprichting BV); dan geeft VIES een consultatienummer als bewijs.
      QBICLE_BTW_NUMMER: ${QBICLE_BTW_NUMMER:-}
    restart: unless-stopped
    entrypoint: ["npx", "--no-install", "tsx", "packages/worker/src/cli.ts"]

  api:
    build: .
    profiles: ["api"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      QBICLE_APP_ORIGIN: ${QBICLE_APP_ORIGIN:-http://localhost:3000}
      # Lokaal zonder https; in productie altijd aan laten.
      QBICLE_SECURE_COOKIES: "uit"
      PORT: "8080"
      # Uit .env (niet gecommit); zonder sleutel gaat mail naar de console.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_REPLY_TO: ${QBICLE_MAIL_REPLY_TO:-}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
      # Btw verlegd: 'test' = nep-VIES zonder netwerk (000000 = ongeldig, 999999 = storing); leeg = echte VIES van de EU.
      QBICLE_VIES: ${QBICLE_VIES:-}
      # Btw-nummer van Qbicle (na oprichting BV); dan geeft VIES een consultatienummer als bewijs.
      QBICLE_BTW_NUMMER: ${QBICLE_BTW_NUMMER:-}
    ports:
      - "8080:8080"
    entrypoint: ["npx", "--no-install", "tsx", "apps/api/src/server.ts"]

  # Klantomgeving (registreren, abonnement, dashboard) met de API erin onder /api/v1.
  web:
    build: .
    profiles: ["web"]
    depends_on:
      db:
        condition: service_healthy
      # Zonder worker blijft het dashboard leeg: hij start vanzelf mee.
      worker:
        condition: service_started
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      # Moet het adres zijn dat je in de browser gebruikt (inloglinks en controle op herkomst).
      QBICLE_APP_ORIGIN: ${QBICLE_WEB_ORIGIN:-http://localhost:3000}
      QBICLE_SECURE_COOKIES: "uit"
      PORT: "3000"
      # Dit is de lokale testopstelling, geen productie (de image zet standaard NODE_ENV=production).
      NODE_ENV: development
      # Testbetalingen tot Mollie gekoppeld is (wacht op de BV).
      QBICLE_BETAALPROVIDER: nep
      QBICLE_NEPBETALING: "aan"
      QBICLE_DEMODATA: "aan"
      # 'aan' = mail (inloglinks) in het Terminal-venster in plaats van via Brevo.
      QBICLE_MAIL_CONSOLE: ${QBICLE_MAIL_CONSOLE:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_REPLY_TO: ${QBICLE_MAIL_REPLY_TO:-}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
      # Btw verlegd: 'test' = nep-VIES zonder netwerk (000000 = ongeldig, 999999 = storing); leeg = echte VIES van de EU.
      QBICLE_VIES: ${QBICLE_VIES:-}
      # Btw-nummer van Qbicle (na oprichting BV); dan geeft VIES een consultatienummer als bewijs.
      QBICLE_BTW_NUMMER: ${QBICLE_BTW_NUMMER:-}
    ports:
      # Andere poort op je computer: QBICLE_WEB_PORT=3300 (scripts/klantomgeving.sh kiest zelf een vrije).
      - "${QBICLE_WEB_PORT:-3000}:3000"
    entrypoint: ["npx", "--no-install", "tsx", "apps/web/src/server.ts"]

  # Interne cockpit voor Qbicle-medewerkers (klanten, abonnementen, incasso's, gebruik, support, agents).
  cockpit:
    build: .
    profiles: ["cockpit"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qbicle:qbicle@db:5432/qbicle
      # Moet het adres zijn dat je in de browser gebruikt (inloglinks en controle op herkomst).
      QBICLE_COCKPIT_ORIGIN: ${QBICLE_COCKPIT_ORIGIN:-http://localhost:3100}
      QBICLE_APP_ORIGIN: ${QBICLE_WEB_ORIGIN:-http://localhost:3000}
      QBICLE_SECURE_COOKIES: "uit"
      PORT: "3100"
      # Lokaal: zonder Brevo-sleutel staan inloglinks in de terminal in plaats van in je mail.
      NODE_ENV: development
      QBICLE_BETAALPROVIDER: nep
      # Versleuteling van MFA-geheimen; zonder waarde lokaal een vaste ontwikkelsleutel.
      QBICLE_SECRETS_KEYS: ${QBICLE_SECRETS_KEYS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      QBICLE_MAIL_FROM: ${QBICLE_MAIL_FROM:-}
      QBICLE_MAIL_FROM_NAME: ${QBICLE_MAIL_FROM_NAME:-Qbicle}
      QBICLE_MAIL_REPLY_TO: ${QBICLE_MAIL_REPLY_TO:-}
      QBICLE_MAIL_SANDBOX: ${QBICLE_MAIL_SANDBOX:-}
      # Btw verlegd: 'test' = nep-VIES zonder netwerk (000000 = ongeldig, 999999 = storing); leeg = echte VIES van de EU.
      QBICLE_VIES: ${QBICLE_VIES:-}
      # Btw-nummer van Qbicle (na oprichting BV); dan geeft VIES een consultatienummer als bewijs.
      QBICLE_BTW_NUMMER: ${QBICLE_BTW_NUMMER:-}
    ports:
      - "${QBICLE_COCKPIT_PORT:-3100}:3100"
    entrypoint: ["npx", "--no-install", "tsx", "apps/cockpit/src/server.ts"]

volumes:
  qbicle-db:
