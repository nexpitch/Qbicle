# Alleen voor lokale ontwikkeling. Productie draait op beheerde PostgreSQL in de EU.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qbicle
      POSTGRES_PASSWORD: qbicle
      POSTGRES_DB: qbicle
    ports:
      - "5432:5432"
    volumes:
      - qbicle-db:/var/lib/postgresql/data
volumes:
  qbicle-db:
